  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const isLocalhost = Boolean(
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1' ||
        window.location.hostname === '[::1]'
      );

      if ('serviceWorker' in navigator) {
        let refreshing = false;
        // Automatically reload when a new service worker version activates
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        if (isLocalhost) {
          // In development on localhost, unregister any existing service worker and purge caches
          // so edits show up INSTANTLY without stale cache locks.
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((keys) => {
              for (const key of keys) {
                caches.delete(key);
              }
            });
          }
        } else if (window.location.protocol.startsWith('http')) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then((reg) => {
              // Immediately check for SW updates
              reg.update();
              // Periodically check for updates every 60 seconds
              setInterval(() => {
                reg.update().catch(() => {});
              }, 60 * 1000);
            }).catch((err) => {
              console.log('SW registration note:', err.message);
            });
          });
        }
      }
    </script>
  </body>
</html>
